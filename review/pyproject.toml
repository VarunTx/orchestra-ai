[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-review"
version = "0.1.0"
description = "Local review of coding-agent sessions: wasted steps, with evidence"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
orchestra-review = "orchestra_review.cli:main"

[tool.setuptools]
packages = ["orchestra_review"]
