# Project-scoped Codex MCP configuration (trusted projects only).
# The bearer token is read from the environment, never stored here.
#
#   export ORCHESTRA_MCP_TOKEN=$(grep '^MCP_CLIENT_TOKEN=' .env.mcp-local | cut -d= -f2-)
#   docker compose --profile mcp up -d --build --wait mcp
#
# Override ORCHESTRA_MCP_URL to point at another endpoint; it defaults to the
# local Compose service below.

[mcp_servers.orchestra]
url = "http://127.0.0.1:8765/mcp"
bearer_token_env_var = "ORCHESTRA_MCP_TOKEN"
startup_timeout_sec = 20
tool_timeout_sec = 90

# Read tools may run unattended; anything that mutates is confirmed first, and
# terminating a run is always prompted because it stops real engine work.
default_tools_approval_mode = "writes"
