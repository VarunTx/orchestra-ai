conductor.db.type=postgres
conductor.queue.type=postgres
conductor.external-payload-storage.type=postgres
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:conductor}
spring.datasource.username=${POSTGRES_USER:conductor}
spring.datasource.password=${POSTGRES_PASSWORD}
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
loadSample=false
conductor.app.ownerEmailMandatory=false
conductor.app.workflowExecutionLockEnabled=true
